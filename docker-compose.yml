version: "3.8"

services:
  mysql:
    image: mysql:8.0
    container_name: boilerplate_mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: boilerplate_db
      MYSQL_USER: user
      MYSQL_PASSWORD: password
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    image: sachinace033/boilerplate-backend:latest
    container_name: boilerplate_backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      DATABASE_URL: mysql+pymysql://user:password@mysql:3306/boilerplate_db
    depends_on:
      mysql:
        condition: service_healthy
    command: >
      sh -c "
        echo 'Waiting for MySQL...' &&
        sleep 10 &&
        alembic upgrade head &&
        python scripts/init_db.py &&
        uvicorn app.main:app --host 0.0.0.0 --port 8000
      "

  frontend:
    image: sachinace033/boilerplate-frontend:latest
    container_name: boilerplate_frontend
    restart: unless-stopped
    ports:
      - "5173:5173"
    depends_on:
      - backend
    environment:
      VITE_API_URL: http://13.207.237.4:8000/api/v1

volumes:
  mysql_data:
