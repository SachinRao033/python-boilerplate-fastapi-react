name: CI-CD Pipeline

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # --------------------------------
      # 1. Checkout Repository
      # --------------------------------
      - name: Checkout code
        uses: actions/checkout@v4

      # --------------------------------
      # 2. Login to Docker Hub
      # --------------------------------
      - name: Login Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # --------------------------------
      # 3. Build & Push Backend
      # --------------------------------
      - name: Build and Push Backend
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/boilerplate-backend:latest

      # --------------------------------
      # 4. Build & Push Frontend
      # --------------------------------
      - name: Build and Push Frontend
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/boilerplate-frontend:latest

  deploy:
    needs: build
    runs-on: ubuntu-latest

    steps:
      # --------------------------------
      # 5. Configure SSH
      # --------------------------------
      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.EC2_SSH_KEY }}" > ~/.ssh/key.pem
          chmod 600 ~/.ssh/key.pem
          ssh-keyscan -H ${{ secrets.EC2_HOST }} >> ~/.ssh/known_hosts

      # --------------------------------
      # 6. Deploy to EC2
      # --------------------------------
      - name: Deploy to EC2
        run: |
          ssh -i ~/.ssh/key.pem ${{ secrets.EC2_USERNAME }}@${{ secrets.EC2_HOST }} << EOF
            set -e

            echo "===== Deploy Started ====="

            cd ~/boilerplate

            echo "Pull latest code"
            git pull origin main

            echo "Login Docker Hub"
            docker login -u "${{ secrets.DOCKER_USERNAME }}" -p "${{ secrets.DOCKER_PASSWORD }}"

            echo "Pull latest images"
            docker compose pull

            echo "Restart containers"
            docker compose down
            docker compose up -d

            echo "Run database migrations"
            docker exec boilerplate_backend alembic upgrade head

            echo "Initialize admin user"
            docker exec boilerplate_backend python scripts/init_db.py

            echo "Remove unused images"
            docker image prune -f

            echo "===== Deployment Successful ====="

            docker compose ps
          EOF
